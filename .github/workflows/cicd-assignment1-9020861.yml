name: cicd-assignment1-9020861

on:
  push:
    branches: [ develop, release, assignment1-9020861-varun ]
  pull_request:
    branches: [ varun-9020861 ]

jobs:
  # ======================
  # A) BUILD STAGE
  # ======================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Explicit "compile/build" step for Python
      - name: Compile Python bytecode
        run: python -m compileall -q .

      - name: Upload build artifact (compiled bytecode)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pyc
          path: |
            **/__pycache__/**

  # ======================
  # B) TEST STAGE
  # ======================
  test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fails the workflow if tests fail
      - name: Run unit tests
        run: pytest -q

      # F) BONUS: Security scan (filesystem)
      - name: Security scan (Trivy - filesystem)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ======================
  # C + D + E) CONTAINERIZE + PUBLISH (DEV)
  # ======================
  publish-dev:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref_name == 'develop'
    environment: dev
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_REPO }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Show environment variables pulled from the "dev" Environment (E)
      - name: Show environment vars (dev)
        run: |
          echo "APP_ENV=${{ vars.APP_ENV }}"
          echo "API_ENDPOINT=${{ vars.API_ENDPOINT }}"

      - name: Log in to DockerHub (D)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # C) Containerize + tag; D) Publish to DockerHub
      - name: Build & Push (dev tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_ENV=${{ vars.APP_ENV }}
            API_ENDPOINT=${{ vars.API_ENDPOINT }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:dev-${{ github.run_number }}
            ${{ env.IMAGE_NAME }}:latest-dev

  # ======================
  # C + D + E) CONTAINERIZE + PUBLISH (PRODUCTION)
  # ======================
  publish-prod:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref_name == 'release'
    environment: production
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_REPO }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Show environment variables pulled from the "production" Environment (E)
      - name: Show environment vars (production)
        run: |
          echo "APP_ENV=${{ vars.APP_ENV }}"
          echo "API_ENDPOINT=${{ vars.API_ENDPOINT }}"

      - name: Log in to DockerHub (D)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # C) Containerize + tag; D) Publish to DockerHub
      - name: Build & Push (prod tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_ENV=${{ vars.APP_ENV }}
            API_ENDPOINT=${{ vars.API_ENDPOINT }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:prod-${{ github.run_number }}
            ${{ env.IMAGE_NAME }}:latest
